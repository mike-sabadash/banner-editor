<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;padding:16px;font:12px/1.45 Inter,Arial,sans-serif;background:var(--figma-color-bg);color:var(--figma-color-text)}button,select,input{font:inherit;color:inherit;background:var(--figma-color-bg);border:1px solid var(--figma-color-border);border-radius:8px;height:34px;padding:0 10px}.card{border:1px solid var(--figma-color-border);border-radius:12px;padding:12px}.picker{display:grid;grid-template-columns:1fr auto;gap:8px}.note{color:var(--figma-color-text-secondary);margin:0 0 8px}.custom{display:none;grid-template-columns:1fr 20px 1fr;align-items:center;gap:6px;margin-top:8px}.custom.on{display:grid}.primary{background:var(--figma-color-bg-brand,#0d99ff);color:white;border-color:transparent;font-weight:650}</style></head><body><div class="card"><b>Add format</b><p class="note">Presets are grouped by real RU/CIS display usage. Manual size remains available.</p><div class="picker"><select id="format"></select><button class="primary" id="add">Add</button></div><div id="custom" class="custom"><input id="w" inputmode="numeric" placeholder="Width"><span>×</span><input id="h" inputmode="numeric" placeholder="Height"></div></div><script type="module">import{formatOptionsHtml,parseFormatValue}from'./format-picker.js';const select=document.querySelector('#format'),custom=document.querySelector('#custom');select.innerHTML=formatOptionsHtml();select.addEventListener('change',()=>custom.classList.toggle('on',select.value==='custom'));document.querySelector('#add').addEventListener('click',()=>{let size=parseFormatValue(select.value);if(!size)size={width:Number(document.querySelector('#w').value),height:Number(document.querySelector('#h').value)};if(!size.width||!size.height)return;parent.postMessage({pluginMessage:{type:'add-manual-format',format:size}},'*')});</script></body></html>
