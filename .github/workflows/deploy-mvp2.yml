name: Deploy Bannermatic MVP2

on:
  push:
    branches:
      - codex/mvp2-figma-cloud-runtime
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: bannermatic-draft-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secret exists
        run: |
          if [ -z "${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}" ]; then
            echo "BANNERMATIC_SERVER_SSH_KEY is not configured" >&2
            exit 1
          fi
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}" > ~/.ssh/bannermatic_server
          chmod 600 ~/.ssh/bannermatic_server
          ssh-keyscan -p 2222 213.182.208.29 >> ~/.ssh/known_hosts
      - name: Deploy exact MVP2 branch
        run: |
          ssh -i ~/.ssh/bannermatic_server -p 2222 -o IdentitiesOnly=yes root@213.182.208.29 \
            'cd /var/www/banner-editor && export GIT_SSH_COMMAND="ssh -i /root/.ssh/banner_editor_deploy -p 443 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" && git fetch origin codex/mvp2-figma-cloud-runtime:refs/remotes/origin/codex/mvp2-figma-cloud-runtime && git reset --hard HEAD && if git ls-files --error-unmatch .github/workflows/deploy-mvp2.yml >/dev/null 2>&1; then git checkout -- .github/workflows/deploy-mvp2.yml; else rm -f .github/workflows/deploy-mvp2.yml; fi && git switch -C codex/mvp2-figma-cloud-runtime origin/codex/mvp2-figma-cloud-runtime --no-track && BANNERMATIC_DEPLOY_BRANCH=codex/mvp2-figma-cloud-runtime bash scripts/deploy-ads.sh'
      - name: Verify public Bannermatic entry
        run: |
          curl -fsS --max-time 30 https://studio.bannermatic.online/healthz
          html="$(curl -fsS --max-time 30 https://studio.bannermatic.online/)"
          printf '%s' "$html" | grep -q '<div id="root"></div>'
          asset="$(printf '%s' "$html" | grep -oE 'src="/assets/[^"]+\.js"' | head -1 | cut -d'"' -f2)"
          test -n "$asset"
          bundle="$(curl -fsS --max-time 30 "https://studio.bannermatic.online$asset")"
          printf '%s' "$bundle" | grep -q 'Custom Bézier'
          printf '%s' "$bundle" | grep -q 'Duration '
          printf '%s' "$bundle" | grep -q 'From left'
          printf '%s' "$bundle" | grep -q 'Fade'
          if printf '%s' "$bundle" | grep -q 'IN · MS'; then echo 'Legacy IN · MS control still present in production bundle' >&2; exit 1; fi
          echo 'PRODUCTION_MOTION_UI_BUNDLE_OK'

