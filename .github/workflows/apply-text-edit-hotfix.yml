name: Apply text editing hotfix
on:
  push:
    branches: [codex/mvp2-figma-cloud-runtime]
permissions:
  contents: write
jobs:
  hotfix:
    if: github.event.head_commit.message == 'chore: apply production text editing hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mvp2-figma-cloud-runtime
      - name: Patch text editing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/web-scene/WebSceneEditor.tsx')
          s=p.read_text()
          old='fontSize:30,fontWeight:600,fontFamily:"Inter"'
          new='fontSize:16,fontWeight:400,fontFamily:"Inter"'
          assert old in s, 'default text style pattern missing'
          s=s.replace(old,new,1)
          old='onDoubleClick={e=>{e.stopPropagation();if(item.kind==="text")setEditingTextId(item.id);else if(item.kind==="image"){setLayerId(item.id);startCrop()}}}'
          new='onDoubleClick={e=>{e.stopPropagation();if(item.kind==="text"){setEditingTextId(item.id);requestAnimationFrame(()=>{const el=e.currentTarget.querySelector("[contenteditable=true]") as HTMLElement|null;if(!el)return;el.focus();const range=document.createRange(),selection=window.getSelection();range.selectNodeContents(el);range.collapse(false);selection?.removeAllRanges();selection?.addRange(range)})}else if(item.kind==="image"){setLayerId(item.id);startCrop()}}}'
          assert old in s, 'double click pattern missing'
          s=s.replace(old,new,1)
          old='onInput={e=>{if(editingTextId!==item.id)return;const el=e.currentTarget;patchLayerById(item.id,{text:el.textContent||""},false);requestAnimationFrame(()=>{const canvas=canvasRef.current;if(!canvas)return;const h=Math.max(1,el.scrollHeight/canvas.getBoundingClientRect().height*100);patchLayerById(item.id,{masterBox:{...item.box,h}},false)})}} onBlur={e=>{patchLayerById(item.id,{text:e.currentTarget.textContent||""},false);setEditingTextId(null)}}'
          new='onInput={e=>{if(editingTextId!==item.id)return;const el=e.currentTarget,canvas=canvasRef.current;if(!canvas)return;const h=Math.max(1,el.scrollHeight/canvas.getBoundingClientRect().height*100);el.parentElement?.style.setProperty("height",`${h}%`)}} onBlur={e=>{const el=e.currentTarget,canvas=canvasRef.current,h=canvas?Math.max(1,el.scrollHeight/canvas.getBoundingClientRect().height*100):item.box.h;patchLayerById(item.id,{text:el.textContent||"",masterBox:{...item.box,h}},false);setEditingTextId(null)}}'
          assert old in s, 'contenteditable input pattern missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/web-scene/WebSceneEditor.tsx
          git commit -m 'fix: stabilize inline text editing and defaults'
          git push origin HEAD:codex/mvp2-figma-cloud-runtime
