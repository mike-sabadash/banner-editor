name: Validate saved RiffKiller Google config
on:
  push:
    branches: [codex/riffkiller-server-preflight-20261019]
permissions:
  contents: read
concurrency:
  group: riffkiller-server-recovery
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure existing server connection
        env:
          DEPLOY_KEY: ${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -T 10 -p 2222 213.182.208.29 >> ~/.ssh/known_hosts
      - name: Classify existing Google settings without printing values
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/server_key -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 root@213.182.208.29 'python3 -' <<'PY'
          import pathlib,re,json
          path=pathlib.Path('/var/www/riffkiller/.env.example')
          data={}
          for line in path.read_text().splitlines():
           line=line.strip()
           if line and not line.startswith('#') and '=' in line:
            key,value=line.split('=',1);data[key.strip()]=value.strip().strip('"').strip("'")
          cid=data.get('GOOGLE_CLIENT_ID','')
          secret=data.get('GOOGLE_CLIENT_SECRET','')
          print('SAVED_GOOGLE_CONFIG_VALIDITY',json.dumps({'client_id_format_valid':bool(re.fullmatch(r'[0-9]+-[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com',cid)),'secret_format_valid':secret.startswith('GOCSPX-') and len(secret)>25,'has_placeholder':any(word in (cid+' '+secret).lower() for word in ['your_','your-','placeholder','xxxx','example'])}))
          PY
