name: Inspect current RiffKiller authentication
on:
  push:
    branches: [codex/riffkiller-server-preflight-20261019]
permissions:
  contents: read
concurrency:
  group: riffkiller-server-recovery
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure existing server connection
        env:
          DEPLOY_KEY: ${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -T 10 -p 2222 213.182.208.29 >> ~/.ssh/known_hosts
      - name: Read current auth fingerprints and configuration presence
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/server_key -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 root@213.182.208.29 'python3 -' <<'PY'
          import pathlib,subprocess,hashlib,json,urllib.request,urllib.error,urllib.parse,stat
          root=pathlib.Path('/var/www/riffkiller')
          print('SERVER_GIT_HEAD',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip())
          files=['index.html','app.html','practice.html','js/practice.js','js/auth-manager.js','js/site-header.js','patreon-callback.html','config/load-env.php','config/session-start.php','config/user-store.php','config/site-url.php','api/auth/google-login.php','api/auth/google-callback.php','api/auth/email-login.php','api/auth/email-register.php','api/patreon-exchange.php']
          for name in files:
           p=root/name
           print('CURRENT_FILE',name,hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else 'MISSING')
          envfile=root/'.env'
          print('ENV_FILE',{'exists':envfile.is_file(),'mode':oct(stat.S_IMODE(envfile.stat().st_mode)) if envfile.exists() else None,'uid':envfile.stat().st_uid if envfile.exists() else None,'gid':envfile.stat().st_gid if envfile.exists() else None})
          php="""require '/var/www/riffkiller/config/load-env.php';$keys=['GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','PATREON_CLIENT_ID','PATREON_CLIENT_SECRET','SITE_URL'];$out=[];foreach($keys as $k){$v=getenv($k)?:($_ENV[$k]??($GLOBALS['RIFFKILLER_ENV'][$k]??''));$out[$k]=strlen((string)$v)>0;}echo json_encode($out);"""
          r=subprocess.run(['runuser','-u','www-data','--','php','-r',php],capture_output=True,text=True)
          print('FPM_USER_ENV_CONFIGURED',r.stdout.strip(),'exit',r.returncode)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          for path in ['/api/auth/google-login.php','/api/me.php','/api/auth/email-login.php','/api/auth/email-register.php']:
           request=urllib.request.Request('https://riffkiller.fun'+path)
           if 'email-' in path:
            request=urllib.request.Request('https://riffkiller.fun'+path,data=b'{}',headers={'Content-Type':'application/json'})
           try: response=opener.open(request,timeout=25)
           except urllib.error.HTTPError as e: response=e
           location=response.headers.get('Location','')
           parts=urllib.parse.urlsplit(location)
           params=urllib.parse.parse_qs(parts.query)
           print('ENDPOINT',path,'status',response.code,'redirect',{'host':parts.hostname,'path':parts.path,'keys':list(params),'callback':params.get('redirect_uri'),'has_state':bool(params.get('state'))})
           if response.code>=400:
            body=response.read(600).decode(errors='replace')
            if 'Google OAuth not configured' in body: print('GOOGLE_CONFIGURATION_MISSING')
            elif path.endswith('email-login.php') or path.endswith('email-register.php'): print('EMAIL_VALIDATION_RESPONSE',body)
          print('OAUTH_READONLY_DIAGNOSIS_DONE')
          PY
