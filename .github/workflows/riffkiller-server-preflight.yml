name: RiffKiller server preflight
on:
  push:
    branches: [codex/riffkiller-server-preflight-20261019]
permissions:
  contents: read
concurrency:
  group: riffkiller-server-recovery
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing server connection
        env:
          DEPLOY_KEY: ${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -T 10 -p 2222 213.182.208.29 >> ~/.ssh/known_hosts
      - name: Read-only RiffKiller preflight
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/server_key -p 2222 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 root@213.182.208.29 'python3 -' <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          root=pathlib.Path('/var/www/riffkiller')
          plan=json.loads(base64.b64decode(''))
          print('RIFFKILLER_ROOT',root.resolve())
          for relative,meta in plan['files'].items():
              target=root/relative
              actual=hashlib.sha256(target.read_bytes()).hexdigest() if target.is_file() else None
              status='BASELINE_OK' if actual==meta['before'] else ('ALREADY_UPDATED' if actual==meta['after'] else 'DIFFERENT')
              print('CODE',relative,status)
          for relative,meta in plan['media'].items():
              target=root/relative
              status='MISSING'
              if target.is_file():
                  status='MATCH' if hashlib.sha256(target.read_bytes()).hexdigest()==meta['sha256'] else 'DIFFERENT'
              print('MEDIA',relative,status)
          if (root/'.git').exists():
              result=subprocess.run(['git','-C',str(root),'rev-parse','HEAD'],capture_output=True,text=True)
              print('RIFFKILLER_GIT_HEAD',result.stdout.strip() if result.returncode==0 else 'UNAVAILABLE')
          for directory in ['/root','/var/backups','/var/www/riffkiller']:
              result=subprocess.run(['find',directory,'-maxdepth','3','-type','f','-iname','*riff*.zip'],capture_output=True,text=True)
              for filename in result.stdout.splitlines()[:15]:
                  print('RECOVERY_ARCHIVE',filename)
          public=pathlib.Path('/etc/ssh/ssh_host_rsa_key.pub')
          if public.is_file():
              pem=subprocess.check_output(['ssh-keygen','-f',str(public),'-e','-m','PKCS8'])
              print('PUBLIC_TRANSFER_KEY_B64',base64.b64encode(pem).decode())
          if (root/'.git').exists():
              remote=subprocess.run(['git','-C',str(root),'remote','get-url','origin'],capture_output=True,text=True)
              print('RIFF_REMOTE_TYPE','SSH' if remote.stdout.strip().startswith(('git@','ssh:')) else 'HTTPS_OR_OTHER')
              try:
                  check=subprocess.run(['git','-C',str(root),'ls-remote','origin','HEAD'],capture_output=True,text=True,timeout=25,env={**__import__('os').environ,'GIT_TERMINAL_PROMPT':'0'})
                  print('RIFF_GIT_READ_DEFAULT',check.returncode,check.stdout.strip() if check.returncode==0 else '')
              except subprocess.TimeoutExpired:
                  print('RIFF_GIT_READ_DEFAULT','TIMEOUT')
              for key in pathlib.Path('/root/.ssh').glob('*riff*'):
                  if key.suffix=='.pub' or not key.is_file(): continue
                  try:
                      ssh='ssh -i '+str(key)+' -p 443 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10'
                      check=subprocess.run(['git','ls-remote','git@ssh.github.com:mike-sabadash/riffkiller-site.git','HEAD'],capture_output=True,text=True,timeout=20,env={**__import__('os').environ,'GIT_TERMINAL_PROMPT':'0','GIT_SSH_COMMAND':ssh})
                      print('RIFF_GIT_READ_KEY',key.name,check.returncode,check.stdout.strip() if check.returncode==0 else '')
                  except subprocess.TimeoutExpired:
                      print('RIFF_GIT_READ_KEY',key.name,'TIMEOUT')
          print('RIFFKILLER_PREFLIGHT_CONNECTION_OK')
          PY
