name: Vendor and Deploy Diffusion Studio Upstream

on:
  push:
    branches:
      - feature/diffusion-editor-upstream
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bannermatic-diffusion-upstream
  cancel-in-progress: false

jobs:
  vendor-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bannermatic integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/diffusion-editor-upstream
          fetch-depth: 0

      - name: Verify vendored Diffusion Studio source
        run: |
          set -euo pipefail
          test -f vendor/diffusionstudio-editor/UPSTREAM_COMMIT
          test "$(cat vendor/diffusionstudio-editor/UPSTREAM_COMMIT)" = "666cdced1f6b97a792b63e551f45797649efb27a"

      - name: Restore ignored upstream runtime package
        run: |
          set -euo pipefail
          rm -rf vendor/diffusionstudio-editor/packages/runtime
          mkdir -p vendor/diffusionstudio-editor/packages/runtime
          curl -fsSL --retry 3 -o /tmp/diffusion-editor.tar.gz https://codeload.github.com/diffusionstudio/editor/tar.gz/666cdced1f6b97a792b63e551f45797649efb27a
          tar -xzf /tmp/diffusion-editor.tar.gz --strip-components=3 -C vendor/diffusionstudio-editor/packages/runtime editor-666cdced1f6b97a792b63e551f45797649efb27a/packages/runtime
          test -f vendor/diffusionstudio-editor/packages/runtime/package.json

      - name: Test and build Bannermatic Campaign shell
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Install upstream dependencies
        working-directory: vendor/diffusionstudio-editor
        run: |
          set -euo pipefail
          cp apps/web/.env.example apps/web/.env
          npm ci

      - name: Typecheck upstream web editor
        working-directory: vendor/diffusionstudio-editor
        run: npm run check --workspace=@diffusionstudio/web

      - name: Build upstream web editor
        working-directory: vendor/diffusionstudio-editor
        run: npm run build --workspace=@diffusionstudio/web -- --base=/editor/

      - name: Prepare integrated Campaign and Diffusion artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/diffusion-dist
          cp -a dist /tmp/diffusion-dist
          mkdir -p /tmp/diffusion-dist/editor
          cp -a vendor/diffusionstudio-editor/apps/web/dist/. /tmp/diffusion-dist/editor/
          test -f /tmp/diffusion-dist/index.html
          test -f /tmp/diffusion-dist/editor/index.html

      - name: Verify deploy secret exists
        run: |
          test -n "${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}" || { echo "BANNERMATIC_SERVER_SSH_KEY is not configured" >&2; exit 1; }

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}" > ~/.ssh/bannermatic_server
          chmod 600 ~/.ssh/bannermatic_server
          ssh-keyscan -p 2222 213.182.208.29 >> ~/.ssh/known_hosts

      - name: Upload integrated Studio release
        run: |
          set -euo pipefail
          tar -C /tmp/diffusion-dist -czf /tmp/diffusion-dist.tgz .
          scp -i ~/.ssh/bannermatic_server -P 2222 -o IdentitiesOnly=yes /tmp/diffusion-dist.tgz root@213.182.208.29:/tmp/diffusion-dist.tgz
          ssh -i ~/.ssh/bannermatic_server -p 2222 -o IdentitiesOnly=yes root@213.182.208.29 '
            set -euo pipefail
            release_dir="$(mktemp -d /var/www/banner-editor/dist.release.XXXXXX)"
            cleanup() { rm -rf "$release_dir"; }
            trap cleanup EXIT

            # Keep hashed assets from the two previous releases. A browser can
            # still have an older index.html in memory while a deployment is
            # happening; removing its referenced chunks produces a white SPA.
            # The new artifact is extracted last so it always wins.
            if [ -d /var/www/banner-editor/dist.previous-diffusion ]; then
              cp -a /var/www/banner-editor/dist.previous-diffusion/. "$release_dir/"
            fi
            if [ -d /var/www/banner-editor/dist ]; then
              cp -a /var/www/banner-editor/dist/. "$release_dir/"
            fi
            tar -C "$release_dir" -xzf /tmp/diffusion-dist.tgz

            rm -rf /var/www/banner-editor/dist.previous-diffusion
            if [ -d /var/www/banner-editor/dist ]; then
              mv /var/www/banner-editor/dist /var/www/banner-editor/dist.previous-diffusion
            fi
            mv "$release_dir" /var/www/banner-editor/dist
            trap - EXIT
            rm -f /tmp/diffusion-dist.tgz
          '

      - name: Deploy Campaign API and restart gateway
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bannermatic_server -p 2222 -o IdentitiesOnly=yes root@213.182.208.29 "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /var/www/banner-editor
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "STOP: tracked production changes found"
            git status --short
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i /root/.ssh/banner_editor_deploy -p 443 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git fetch origin feature/diffusion-editor-upstream
          ACTUAL_SHA="$(git rev-parse FETCH_HEAD)"
          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || { echo "STOP: unexpected commit $ACTUAL_SHA"; exit 1; }
          git switch -C feature/diffusion-editor-upstream "$EXPECTED_SHA"
          npm ci
          cp deploy/nginx/ads.rechord.online.conf /etc/nginx/conf.d/studio.bannermatic.online.conf
          cp deploy/nginx/resize-lab.bannermatic.online.conf /etc/nginx/conf.d/resize-lab.bannermatic.online.conf
          nginx -t
          systemctl reload nginx
          pm2 restart banner-openrouter-gateway
          for attempt in {1..20}; do
            curl -fsS --max-time 2 http://127.0.0.1:8791/healthz >/dev/null && break
            [ "$attempt" -lt 20 ] || { pm2 describe banner-openrouter-gateway; exit 1; }
            sleep 1
          done
          echo "STUDIO_API_COMMIT: $(git rev-parse --short HEAD)"
          REMOTE

      - name: Verify public Campaign shell and Diffusion editor
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 30 https://studio.bannermatic.online/)"
          asset="$(grep -oE '/assets/[^" ]+[.]js' <<<"$html" | head -1)"
          test -n "$asset"
          curl -fsS --max-time 30 "https://studio.bannermatic.online$asset" >/tmp/diffusion-bundle.js
          test -s /tmp/diffusion-bundle.js
          grep -q '<title>Bannermatic Studio</title>' <<<"$html" || { echo "PUBLIC_ROOT_NOT_BANNERMATIC"; echo "$html" | head -c 1200; exit 1; }
          editor_html="$(curl -fsSL --max-time 30 https://studio.bannermatic.online/editor/)"
          grep -q '<title>Bannermatic Studio</title>' <<<"$editor_html" || { echo "PUBLIC_EDITOR_NOT_BANNERMATIC"; echo "$editor_html" | head -c 1200; exit 1; }
          editor_asset="$(grep -oE '/editor/assets/[^" ]+[.]js' <<<"$editor_html" | head -1)"
          test -n "$editor_asset"
          curl -fsS --max-time 30 "https://studio.bannermatic.online$editor_asset" >/tmp/diffusion-editor-bundle.js
          test -s /tmp/diffusion-editor-bundle.js
          resize_html="$(curl -fsSL --max-time 30 https://resize-lab.bannermatic.online/)"
          resize_asset="$(grep -oE '/assets/[^" ]+[.]js' <<<"$resize_html" | head -1)"
          test -n "$resize_asset"
          curl -fsS --max-time 30 "https://resize-lab.bannermatic.online$resize_asset" >/tmp/resize-lab-bundle.js
          grep -q 'Resize Lab' /tmp/resize-lab-bundle.js || { echo "PUBLIC_RESIZE_LAB_NOT_DEPLOYED"; exit 1; }
          echo "BANNERMATIC_CAMPAIGN_DIFFUSION_DEPLOY_OK"

      - name: Browser interaction smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/diffusion-browser-smoke && cd /tmp/diffusion-browser-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[];
          page.on('console', m => { if (m.type()==='error') errors.push('console: '+m.text()); });
          page.on('pageerror', e => errors.push('pageerror: '+e.message));
          await page.goto('https://studio.bannermatic.online/', {waitUntil:'networkidle', timeout:60000});
          await page.getByText(/Войти|Sign in/i).first().waitFor({state:'visible'});
          await page.goto('https://studio.bannermatic.online/editor/', {waitUntil:'networkidle', timeout:60000});
          await page.waitForTimeout(1500);
          const buttons=page.locator('button');
          console.log('buttons', await buttons.count());
          const toolbar=page.locator('div.absolute.bottom-4.left-1\\/2').first();
          await toolbar.waitFor({state:'visible'});
          const toolButtons=toolbar.locator('button');
          const toolCount=await toolButtons.count();
          console.log('toolbar-buttons', toolCount);
          if (toolCount < 6) throw new Error('Expected Diffusion toolbar controls');
          const rect=toolButtons.nth(3);
          const before=await rect.getAttribute('class');
          await rect.click();
          await page.waitForTimeout(150);
          const after=await rect.getAttribute('class');
          console.log('rectangle-class-changed', before !== after);
          if (before === after) throw new Error('Rectangle tool did not enter selected state');
          await toolButtons.nth(1).click();
          await page.waitForTimeout(250);
          const menuItems=page.locator('[role="menuitem"]');
          const menuCount=await menuItems.count();
          console.log('menuitems', menuCount);
          if (menuCount < 2) throw new Error('Tool dropdown did not open');
          await page.keyboard.press('Escape');
          // Standalone Studio intentionally starts with an empty scene. Verify
          // the removed demo content does not come back on production boot.
          const bodyText=await page.locator('body').innerText();
          for (const demo of ['Diffusion Studio editor foundation','Product','OPEN']) {
            if (bodyText.includes(demo)) throw new Error('Demo content still present: '+demo);
          }
          console.log('empty-standalone-scene-ok');
          console.log('body-text-sample', (await page.locator('body').innerText()).slice(0,1200));
          if (errors.length) console.log('BROWSER_ERRORS\n'+errors.join('\n'));
          if (errors.length) process.exitCode=2;
          await browser.close();
          EOF
          node smoke.mjs
