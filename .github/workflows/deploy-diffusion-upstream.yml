name: Vendor and Deploy Diffusion Studio Upstream

on:
  push:
    branches:
      - feature/diffusion-editor-upstream
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bannermatic-diffusion-upstream
  cancel-in-progress: false

jobs:
  vendor-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bannermatic integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/diffusion-editor-upstream
          fetch-depth: 0

      - name: Verify vendored Diffusion Studio source
        run: |
          set -euo pipefail
          test -f vendor/diffusionstudio-editor/UPSTREAM_COMMIT
          test "$(cat vendor/diffusionstudio-editor/UPSTREAM_COMMIT)" = "666cdced1f6b97a792b63e551f45797649efb27a"

      - name: Restore ignored upstream runtime package
        run: |
          set -euo pipefail
          rm -rf /tmp/diffusion-runtime vendor/diffusionstudio-editor/packages/runtime
          git clone --filter=blob:none --no-checkout https://github.com/diffusionstudio/editor.git /tmp/diffusion-runtime
          git -C /tmp/diffusion-runtime checkout 666cdced1f6b97a792b63e551f45797649efb27a -- packages/runtime
          cp -a /tmp/diffusion-runtime/packages/runtime vendor/diffusionstudio-editor/packages/runtime

      - name: Install upstream dependencies
        working-directory: vendor/diffusionstudio-editor
        run: |
          set -euo pipefail
          cp apps/web/.env.example apps/web/.env
          npm ci

      - name: Typecheck upstream web editor
        working-directory: vendor/diffusionstudio-editor
        run: npm run check --workspace=@diffusionstudio/web

      - name: Build upstream web editor
        working-directory: vendor/diffusionstudio-editor
        run: npm run build

      - name: Prepare pristine upstream deploy artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/diffusion-dist
          cp -a vendor/diffusionstudio-editor/apps/web/dist /tmp/diffusion-dist
          test -f /tmp/diffusion-dist/index.html

      - name: Verify deploy secret exists
        run: |
          test -n "${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}" || { echo "BANNERMATIC_SERVER_SSH_KEY is not configured" >&2; exit 1; }

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}" > ~/.ssh/bannermatic_server
          chmod 600 ~/.ssh/bannermatic_server
          ssh-keyscan -p 2222 213.182.208.29 >> ~/.ssh/known_hosts

      - name: Upload pristine Diffusion web build as Studio root
        run: |
          set -euo pipefail
          tar -C /tmp/diffusion-dist -czf /tmp/diffusion-dist.tgz .
          scp -i ~/.ssh/bannermatic_server -P 2222 -o IdentitiesOnly=yes /tmp/diffusion-dist.tgz root@213.182.208.29:/tmp/diffusion-dist.tgz
          ssh -i ~/.ssh/bannermatic_server -p 2222 -o IdentitiesOnly=yes root@213.182.208.29 '
            set -euo pipefail
            rm -rf /var/www/banner-editor/dist.previous-diffusion
            if [ -d /var/www/banner-editor/dist ]; then cp -a /var/www/banner-editor/dist /var/www/banner-editor/dist.previous-diffusion; fi
            rm -rf /var/www/banner-editor/dist
            mkdir -p /var/www/banner-editor/dist
            tar -C /var/www/banner-editor/dist -xzf /tmp/diffusion-dist.tgz
            rm -f /tmp/diffusion-dist.tgz
          '

      - name: Verify public Diffusion editor
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 30 https://studio.bannermatic.online/)"
          asset="$(grep -oE '/assets/[^" ]+[.]js' <<<"$html" | head -1)"
          test -n "$asset"
          curl -fsS --max-time 30 "https://studio.bannermatic.online$asset" >/tmp/diffusion-bundle.js
          test -s /tmp/diffusion-bundle.js
          grep -q '<title>Diffusion Studio</title>' <<<"$html" || { echo "PUBLIC_HTML_NOT_DIFFUSION"; echo "$html" | head -c 1200; exit 1; }
          echo "DIFFUSION_UPSTREAM_DEPLOY_OK"

      - name: Browser interaction smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/diffusion-browser-smoke && cd /tmp/diffusion-browser-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[];
          page.on('console', m => { if (m.type()==='error') errors.push('console: '+m.text()); });
          page.on('pageerror', e => errors.push('pageerror: '+e.message));
          await page.goto('https://studio.bannermatic.online/', {waitUntil:'networkidle', timeout:60000});
          await page.waitForTimeout(1500);
          const buttons=page.locator('button');
          console.log('buttons', await buttons.count());
          const toolbar=page.locator('div.absolute.bottom-4.left-1\\/2').first();
          await toolbar.waitFor({state:'visible'});
          const toolButtons=toolbar.locator('button');
          const toolCount=await toolButtons.count();
          console.log('toolbar-buttons', toolCount);
          if (toolCount < 6) throw new Error('Expected Diffusion toolbar controls');
          const rect=toolButtons.nth(3);
          const before=await rect.getAttribute('class');
          await rect.click();
          await page.waitForTimeout(150);
          const after=await rect.getAttribute('class');
          console.log('rectangle-class-changed', before !== after);
          if (before === after) throw new Error('Rectangle tool did not enter selected state');
          await toolButtons.nth(1).click();
          await page.waitForTimeout(250);
          const menuItems=page.locator('[role="menuitem"]');
          const menuCount=await menuItems.count();
          console.log('menuitems', menuCount);
          if (menuCount < 2) throw new Error('Tool dropdown did not open');
          await page.keyboard.press('Escape');
          // Select Product from the timeline, then verify inspector "+" controls
          // mutate the live document rather than merely receiving a click.
          await page.getByText('Product', {exact:true}).last().click();
          await page.waitForTimeout(200);
          const fillHeading=page.getByText('Fill', {exact:true}).last();
          const fillSection=fillHeading.locator('xpath=..');
          const fillPlus=fillSection.getByRole('button').last();
          const beforeFillText=await page.locator('[data-right-sidebar]').innerText();
          await fillPlus.click();
          await page.waitForTimeout(250);
          const afterFillText=await page.locator('[data-right-sidebar]').innerText();
          console.log('fill-plus-mutated', beforeFillText !== afterFillText);
          if (beforeFillText === afterFillText) throw new Error('Inspector Fill plus did not mutate/open inspector');
          await page.keyboard.press('Escape');

          // Regression gate for the inspector "+" controls.
          await page.getByText('Product', {exact:true}).last().click();
          await page.waitForTimeout(200);
          const right=page.locator('[data-right-sidebar]');
          const addFill=right.getByRole('button', {name:'Add fill'});
          await addFill.click();
          await page.waitForTimeout(200);
          const solidRows=await right.getByText('Solid', {exact:true}).count();
          console.log('inspector-add Fill', solidRows);
          if (solidRows < 1) throw new Error('Fill plus did not add a Solid fill');
          await page.keyboard.press('Escape');

          await right.getByRole('button', {name:'Add stroke'}).click();
          await page.waitForTimeout(120);
          if (await right.getByText('Stroke', {exact:true}).count() < 2) throw new Error('Stroke plus failed');
          await page.keyboard.press('Escape');

          await right.getByRole('button', {name:'Add shadow'}).click();
          await page.waitForTimeout(120);
          if (await right.getByText('Shadow', {exact:true}).count() < 2) throw new Error('Shadow plus failed');
          await page.keyboard.press('Escape');

          await right.getByRole('button', {name:'Add effect'}).click();
          await page.waitForTimeout(120);
          if (await right.getByText('Layer Blur', {exact:true}).count() < 1) throw new Error('Effects plus failed');
          await page.keyboard.press('Escape');

          await right.getByRole('button', {name:'Add animation'}).click();
          await page.waitForTimeout(120);
          if (await right.getByText('IN', {exact:true}).count() < 1) throw new Error('Animations plus failed');
          await page.keyboard.press('Escape');

          await right.getByRole('button', {name:'Add mask'}).click();
          await page.waitForTimeout(120);
          if (await page.getByText('Mask', {exact:true}).count() < 1) throw new Error('Masks plus failed');
          console.log('inspector-plus-controls-ok');
          console.log('body-text-sample', (await page.locator('body').innerText()).slice(0,1200));
          if (errors.length) console.log('BROWSER_ERRORS\n'+errors.join('\n'));
          if (errors.length) process.exitCode=2;
          await browser.close();
          EOF
          node smoke.mjs
