name: Plugin final checks

on:
  pull_request:
    paths:
      - "figma-plugin/**"
      - "server/**"
      - "src/campaign/**"
      - "src/mvp2/**"
      - "src/web-scene/**"
      - "src/main.tsx"
      - "scripts/**"
      - "deploy/**"
      - "package*.json"
      - ".github/workflows/plugin-final-checks.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check server/openrouterGateway.mjs
      - run: node --check server/ttKnowledgeService.mjs
      - run: bash -n scripts/deploy-ads.sh
      - name: Package checked Figma plugin
        uses: actions/upload-artifact@v4
        with:
          name: bannermatic-figma-${{ github.event.pull_request.head.sha }}
          path: |
            figma-plugin/manifest.json
            figma-plugin/mvp12-sync-code.js
            figma-plugin/mvp12-sync-ui.html
          if-no-files-found: error
